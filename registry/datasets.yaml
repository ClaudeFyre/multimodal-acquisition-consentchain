# Medical Multimodal Data Lake — dataset registry (hand-curated source of truth)
#
# `python -m medlake registry build` validates this file and writes
# registry/datasets.db (SQLite) + registry/datasets.parquet.
#
# id_namespace: 病人 ID 的"发放机构"。同一 namespace 下的 ID 才可以跨数据集 join
#   (例如 MIMIC-IV / MIMIC-CXR / MIMIC-IV-ED 共用 "MIMIC"；TCIA 影像与 GDC 临床共用 "TCGA")。
#   不同 namespace 下数字相同的 ID 绝不是同一个人。
#
# access_level: open | registration | credentialed_dua | application | controlled
# download_method: idc | gdc | openneuro | physionet | aimi | loni | synapse | kaggle | isic_api | http | manual
# verified: 最近一次人工/程序核对 size、license、访问方式的日期；null = 尚未核对，数字来自论文/二手资料

datasets:

  # ------------------------------------------------------------------ MIMIC family
  - dataset_id: mimic-iv
    dataset_name: MIMIC-IV
    version: "3.1"
    canonical_url: https://physionet.org/content/mimiciv/
    paper_doi: 10.1038/s41597-022-01899-x
    id_namespace: MIMIC
    domain: critical care / hospital EHR
    body_part: [whole_body]
    modality: [EHR]
    image_format: []
    has: [diagnosis, ehr, lab, medication]
    diagnosis_system: [ICD9, ICD10]
    access_level: credentialed_dua
    license: PhysioNet Credentialed Health Data License 1.5.0
    download_method: physionet
    download_params: {slug: mimiciv, version: "3.1", mode: files}
    priority: 1
    notes: hosp/ + icu/ modules. subject_id links to MIMIC-CXR PatientID and MIMIC-IV-ED.
    verified: null

